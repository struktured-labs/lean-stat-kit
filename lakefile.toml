name = "statkit"
version = "0.2.0"
defaultTargets = ["StatKit", "Examples"]

[leanOptions]
autoImplicit = false

# Mathlib v4.35.0 (tag v4.35.0 = commit 56a005855ea17e0b0958f73ec801ae140b0a1679)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# the reusable library (dataset-agnostic)
[[lean_lib]]
name = "StatKit"

# worked examples (synthetic toy data; BTC Bitstamp daily closes as an illustration only)
[[lean_lib]]
name = "Examples"
